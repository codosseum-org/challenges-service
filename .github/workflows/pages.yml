name: Publish OpenAPI to GitHub Pages

on:
  push:
    branches: [ main, development ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate OpenAPI file
        shell: bash
        run: |
          set -euo pipefail

          # Build the project and generate OpenAPI spec
          ./gradlew build --no-daemon

          # Prepare publish directory
          mkdir -p public
          
          cp generated-openapi/openapi.yaml public/openapi.yaml

          if [ ! -f public/openapi.yaml ]; then
            echo "OpenAPI YAML not found. Ensure the generation task writes to generated-openapi/openapi.yaml or one of the fallback locations." >&2
            exit 1
          fi

      - name: Upload artifact for Pages
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ github.run_id }}
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}
